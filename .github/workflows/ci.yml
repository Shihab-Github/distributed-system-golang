name: CI

on: 
    push: 
        branches: [main]
    pull_request:
        branches: [main]
        
jobs:
    build-and-test:
        runs-on: ubuntu-latest

        services:
            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: install Go
              uses: actions/setup-go@v5
              with: 
                go-version: '1.23'
            
            - name: Build
              run: go build -v ./...

            - name: Test
              run: go test -v ./...
            